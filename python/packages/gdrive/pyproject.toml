[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drivefs-gdrive"
version = "0.1.0"
description = "Google Drive backend for drivefs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["drivefs>=0.1,<1", "httpx>=0.28,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
drivefs_gdrive = ["py.typed"]
