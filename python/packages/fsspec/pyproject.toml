[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drivefs-fsspec"
version = "0.1.0"
description = "Read-only fsspec adapter for drivefs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["drivefs>=0.1,<1", "fsspec>=2024.12,<2027"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
drivefs_fsspec = ["py.typed"]
